[package]
name = "copilot-task-manager"
version = "0.1.0"
description = "A Trello-style Kanban task manager"
authors = ["Copilot Task Manager contributors"]
edition = "2021"

[lib]
name = "copilot_task_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
